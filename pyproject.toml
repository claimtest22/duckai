[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddgai"
version = "1.1.2"
description = "High-performance reverse-engineered Duck.ai (DuckDuckGo AI Chat) client"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "frat"}
]
keywords = ["ddgai", "duck.ai", "duckduckgo", "ai", "chat", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "curl_cffi>=0.7.0",
    "orjson>=3.9.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/claimtest22/duckai"
Repository = "https://github.com/claimtest22/duckai"

[tool.setuptools.packages.find]
where = ["."]
include = ["duckai*"]
