name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check PyPI token
        env:
          PYPI_TOKEN: ${{ secrets.pypi || secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::No PyPI token found. Add a repository secret named 'pypi' (or 'PYPI_API_TOKEN') with your PyPI API token."
            exit 1
          fi
          echo "PyPI token is present"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypi || secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing dist/*
